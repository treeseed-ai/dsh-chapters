name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# Never two GPU-free but browser-heavy e2e chains fighting for the same
# throwaway homes/ports across concurrent pushes of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────── deterministic plane: unit + integration ─────────────────────────
  test:
    name: typecheck · build · unit + integration (coverage gate 85/85/85)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # All dependencies (incl. every @deepseek-ai/* devDep) resolve from the
      # PUBLIC registry — no install secret and no private-registry config.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # The gate IS the contract: c8 --check-coverage fails the job below
      # 85% on statements, branches, functions (and lines). Current ledger:
      # 97.98 / 85.61 / 93.62. Reports land in var/coverage for the artifact.
      - name: unit + integration with coverage gate
        # scripts/ci-gate.sh = the gate + ::error:: annotations naming the metric
        # and the failing tests. A red gate used to leave only "Process completed
        # with exit code 1" behind (the summary step below the gate never ran, and
        # the coverage artifact sits behind a token) — measured on the 0.1.6 ship,
        # where every local reproduction of the same commit was green.
        run: bash scripts/ci-gate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-deterministic
          path: var/coverage/
      # treedx-live.test.ts skips itself when TreeDX is not configured (the
      # service source is a private clone); configured-but-unreachable FAILS.
      # The TreeDX transport is still proven in CI against the in-process
      # stub: treedx-{provider,sync,link,provider-branches}.test.ts.
      - name: test summary
        if: always()
        run: |
          node -e "const s=require('./var/coverage/coverage-summary.json').total;
            console.log('| metric | covered | total | pct |');
            for (const k of ['lines','statements','branches','functions'])
              console.log('|',k,'|',s[k].covered,'|',s[k].total,'|',s[k].pct+'%|');" >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────── acceptance plane: model-tape replay ─────────────────────────
  # Does the PINNED host even support the mechanism the plugin now uses? A preset is a
  # registered declaration row from @deepseek-ai/dsh 0.1.7-alpha.1 (0.2.0 is the support
  # floor), and the e2e chain pins 0.1.5-rc.1 for tape bytes — so the chain cannot run
  # until the lock moves AND the tapes are re-distilled (docs/backlog.md). This job says
  # so in the run log; the acceptance job below is SKIPPED-BY-DECISION, visibly, rather
  # than silently red or silently green over a preset it never mounted.
  host-capability:
    name: does the pinned host support preset declaration rows?
    runs-on: ubuntu-latest
    outputs:
      preset-rows: ${{ steps.probe.outputs.preset-rows }}
      pinned: ${{ steps.probe.outputs.pinned }}
    steps:
      - uses: actions/checkout@v4
      - id: probe
        run: |
          V=$(node -p "require('./dev/dsh-host-lock/package.json').dependencies['@deepseek-ai/dsh']")
          M=$(node -e "const v=process.argv[1];const m=/^(\d+)\.(\d+)/.exec(v);console.log(m && (Number(m[1])>0||Number(m[2])>=2) ? 'true':'false')" "$V")
          echo "pinned=$V" >> "$GITHUB_OUTPUT"; echo "preset-rows=$M" >> "$GITHUB_OUTPUT"
          if [ "$M" = "true" ]; then
            echo "pinned host $V registers preset declaration rows — acceptance chain runs" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### acceptance chain SKIPPED: the pinned host ($V) cannot register preset declaration rows"
              echo
              echo "The plugin registers the 'chapters' preset as a declaration row (0.2.0 is the support floor; src/preset.ts), so the tape chain needs dev/dsh-host-lock moved to a 0.2.x host AND the tapes re-distilled - the persona suffix is prompt bytes that changed with it. Not red, not silently green: NOT RUN. Track it in docs/backlog.md."
            } >> "$GITHUB_STEP_SUMMARY"
            # `::warning::` is the workflow command; there is no $GITHUB_WARNING file, and
            # writing to an unset variable fails the step with `ambiguous redirect`.
            echo "::warning::pinned host $V predates preset declaration rows - acceptance chain skipped (docs/backlog.md)"
          fi

  e2e-replay:
    name: acceptance — eight tape-replay segments, no LLM
    needs: host-capability
    if: needs.host-capability.outputs.preset-rows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The e2e boots spawn the INSTALLED dsh host. Not `npm i -g`: the host's
      # version alone is NOT reproducible (its caret ranges float, and base
      # rc.2 -> rc.3 changed system-prompt bytes every tape depends on), and
      # npm's global mode rewrites the plugin tree (measured: sandbox family
      # vanishes, boot dies 'could not be resolved'). So the host ships as a
      # HERMETIC LOCKFILE — dev/dsh-host-lock — resolved with --before pinned
      # to the verified install date, materialized by `npm ci` (identical
      # tree on any npm version, prebuilt natives, no install scripts run).
      # The whole repo stays npm-only; pnpm appears NOWHERE (measured with a
      # PATH tripwire: the dev profile is built via `npm install file:…` and
      # the host never invokes pnpm at boot — only its `dsh plugin` writer
      # did, which this repo simply doesn't use).
      - name: install the pinned DSH host from its hermetic lockfile
        run: |
          npm ci --prefix "$GITHUB_WORKSPACE/dev/dsh-host-lock" --no-save --no-audit --no-fund || (cd dev/dsh-host-lock && npm ci --no-audit --no-fund)
          echo "$GITHUB_WORKSPACE/dev/dsh-host-lock/node_modules/.bin" >> "$GITHUB_PATH"
      - run: dsh --version
      # chromium's shared-library deps (the Playwright image lacks some) +
      # zstd: the durable session logs are zstd frames and EVERY spec's
      # turn-complete poll shells out to it — ubuntu-latest doesn't ship the
      # binary, and session.ts's honest catch made the silence indistinguishable
      # from a hung model for three 20-minute CI runs (measured 2026-09-24).
      - run: sudo apt-get update && sudo apt-get install -y libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libgbm1 libasound2t64 zstd
      # Self-checking chain: pins the host version, builds, bootstraps the
      # scratch home, installs chromium into var/ms-playwright, and runs
      # E2E_MODEL=replay npm run test:e2e (suite/fork/heavy/arrival/enrich/fanout/
      # rules). Tape misses answer as loud 503s — nothing talks to a model.
      # E2E_TAPE_DIFF: a miss also dumps the normalized incoming vs the
      # stored same-length prefixes, so the exact divergent byte pair is
      # downloadable from the failure artifact instead of being re-guessed.
      - name: tape replay (eight segments, no LLM)
        run: bash scripts/ci-replay.sh
        env:
          E2E_TAPE_DIFF: ${{ github.workspace }}/var/e2e-tape-diffs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-replay-diagnostics
          path: |
            test-results/
            var/e2e-boot.json
            var/e2e-tape-misses.log
            var/e2e-tape-diffs/
            var/e2e-server-*.log
            var/e2e-engine-errors.log
            var/e2e-home-*/sessions/
            var/e2e-home-*/storages/
            var/e2e-home-*/settings.yaml
          if-no-files-found: ignore
