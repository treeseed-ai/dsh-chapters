name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# Never two GPU-free but browser-heavy e2e chains fighting for the same
# throwaway homes/ports across concurrent pushes of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────── deterministic plane: unit + integration ─────────────────────────
  test:
    name: typecheck · build · unit + integration (coverage gate 85/85/85)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # All dependencies (incl. every @deepseek-ai/* devDep) resolve from the
      # PUBLIC registry — no install secret and no private-registry config.
      - run: npm ci
      # The pinned host too, and BEFORE the gate: several deterministic rows read host FACTS out of
      # the installed bundle (the overflow classifier in `@deepseek-ai/dsh-llm`, the plan-card shape in
      # `dsh-session`) and refuse to read the repo's stale 0.1.5-rc.2 compile-time closure, because a
      # drift gate against the wrong version is a rumor. The acceptance job already installs this; the
      # deterministic job did not, so the rows passed on any laptop with a global `dsh` and went red on
      # a runner that has none — measured 2026-10-23 on PR #89 (2 failures, not coverage).
      - name: install the pinned DSH host for the host-fact rows
        run: |
          npm ci --prefix "$GITHUB_WORKSPACE/dev/dsh-host-lock" --no-save --no-audit --no-fund || (cd dev/dsh-host-lock && npm ci --no-audit --no-fund)
          echo "$GITHUB_WORKSPACE/dev/dsh-host-lock/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npm run typecheck
      - run: npm run typecheck:client
      # #83 ratchet: `tests/e2e` has never been type-checked — tsconfig.json excludes the
      # directory and Playwright transpiles without checking — which is how a
      # `ReferenceError: rotated is not defined` in a spec helper cost a nine-leg re-record.
      # Full cleanup stays the open issue; not getting worse is gateable today.
      - name: e2e typecheck ratchet
        run: bash scripts/e2e-typecheck-ratchet.sh
      - run: npm run build
      # #156: the corpus anchor, enforced in the job that can actually block the merge. The acceptance job is advisory by
      # maintainer decision (#92) — a check placed there would enforce nothing — so the tape bytes are compared here,
      # with no browser and no model. It refuses only when model-facing bytes moved (re-record); a build-only difference
      # is advisory, so an ordinary `src/` edit cannot hold the line hostage to a 45-minute re-distill.
      # (Wording note: the shape row at e2e-pins-single-authority.test.ts counts advisory markers in this file and was
      # correctly tripped by naming that key in prose — one job may be advisory, and saying so in a comment is not a way
      # to add a second one.)
      - run: npm run corpus:check
      # The gate IS the contract: c8 --check-coverage fails the job below
      # 85% on statements, branches, functions (and lines). Current ledger:
      # 97.98 / 85.61 / 93.62. Reports land in var/coverage for the artifact.
      - name: unit + integration with coverage gate
        # scripts/ci-gate.sh = the gate + ::error:: annotations naming the metric
        # and the failing tests. A red gate used to leave only "Process completed
        # with exit code 1" behind (the summary step below the gate never ran, and
        # the coverage artifact sits behind a token) — measured on the 0.1.6 ship,
        # where every local reproduction of the same commit was green.
        run: bash scripts/ci-gate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-deterministic
          path: var/coverage/
      # treedx-live.test.ts skips itself when TreeDX is not configured (the
      # service source is a private clone); configured-but-unreachable FAILS.
      # The TreeDX transport is still proven in CI against the in-process
      # stub: treedx-{provider,sync,link,provider-branches}.test.ts.
      - name: test summary
        if: always()
        run: |
          node -e "const s=require('./var/coverage/coverage-summary.json').total;
            console.log('| metric | covered | total | pct |');
            for (const k of ['lines','statements','branches','functions'])
              console.log('|',k,'|',s[k].covered,'|',s[k].total,'|',s[k].pct+'%|');" >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────── acceptance plane: model-tape replay ─────────────────────────
  # Does the PINNED host even support the mechanism the plugin now uses? A preset is a
  # registered declaration row from @deepseek-ai/dsh 0.1.7-alpha.1 (0.2.0 is the support
  # floor), and the e2e chain pins whatever dev/dsh-host-lock resolves — the chain runs
  # only when that pin is >= 0.2.0 AND the tapes were distilled against it (docs/backlog.md).
  # The version is READ from the lock (#54: a second literal here and in scripts/ci-replay.sh
  # is how the pin went stale in three places at once). This job says
  # so in the run log; the acceptance job below is SKIPPED-BY-DECISION, visibly, rather
  # than silently red or silently green over a preset it never mounted.
  host-capability:
    name: does the pinned host support preset declaration rows?
    runs-on: ubuntu-latest
    outputs:
      preset-rows: ${{ steps.probe.outputs.preset-rows }}
      pinned: ${{ steps.probe.outputs.pinned }}
      corpus-anchored: ${{ steps.probe.outputs.corpus-anchored }}
    steps:
      - uses: actions/checkout@v4
      - id: probe
        run: |
          V=$(node -p "require('./dev/dsh-host-lock/package.json').dependencies['@deepseek-ai/dsh']")
          # Is the tape CORPUS anchored to that host? Tape prefixes carry the host's prompt
          # composition, so a host move makes replay fail for reasons owned by an earlier change.
          # Refuse by name with the tracked issue, exactly as the preset-row check does — never
          # silently green, never permanently red (#56).
          # the script appends to $GITHUB_OUTPUT itself; do NOT redirect it there too
          node scripts/corpus-anchor.mjs --github-output || true
          if ! node scripts/corpus-anchor.mjs --check; then
            {
              echo "### acceptance chain SKIPPED: the tape corpus is not anchored to the pinned host"
              echo
              echo "Tape prefixes contain the host's system-prompt composition, so a corpus distilled against an older host cannot replay against this one — the failures would belong to an earlier change, not the PR. Refusing by name (never silently green, never permanently red) until \`scripts/distill-tapes.sh\` re-records all nine projects and \`tests/fixtures/model-tape/CORPUS_HOST\` is updated. Tracked by issue #56; the door-selector blocker inside it is #57."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::tape corpus not anchored to the pinned host - acceptance chain skipped (see issue #56)"
          fi
          M=$(node -e "const v=process.argv[1];const m=/^(\d+)\.(\d+)/.exec(v);console.log(m && (Number(m[1])>0||Number(m[2])>=2) ? 'true':'false')" "$V")
          echo "pinned=$V" >> "$GITHUB_OUTPUT"; echo "preset-rows=$M" >> "$GITHUB_OUTPUT"
          if [ "$M" = "true" ]; then
            echo "pinned host $V registers preset declaration rows — acceptance chain runs" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### acceptance chain SKIPPED: the pinned host ($V) cannot register preset declaration rows"
              echo
              echo "The plugin registers the 'chapters' preset as a declaration row (0.2.0 is the support floor; src/preset.ts), so the tape chain needs dev/dsh-host-lock moved to a 0.2.x host AND the tapes re-distilled - the persona suffix is prompt bytes that changed with it. Not red, not silently green: NOT RUN. Track it in docs/backlog.md."
            } >> "$GITHUB_STEP_SUMMARY"
            # `::warning::` is the workflow command; there is no $GITHUB_WARNING file, and
            # writing to an unset variable fails the step with `ambiguous redirect`.
            echo "::warning::pinned host $V predates preset declaration rows - acceptance chain skipped (docs/backlog.md)"
          fi

  e2e-replay:
    # #141: NINE, not ten. `heavy` became a live-provider leg (its request count is run-dependent: six
    # captures of one commit at 5/7/12/23/24 entries), and the goal journeys were already live-only — so the job's own
    # name was claiming coverage of a leg it no longer runs. The list below is generated from scripts/chain-replay.sh.
    name: acceptance — nine tape-replay legs, no LLM
    needs: host-capability
    if: needs.host-capability.outputs.preset-rows == 'true' && needs.host-capability.outputs.corpus-anchored == 'true'
    runs-on: ubuntu-latest
    # BLOCKING again as of #178 (2026-10-30). This job was made advisory by maintainer decision on
    # 2026-10-24 (#92, "ship first, prove second") UNTIL its evidence landed — and it landed: the nine
    # legs replay green on CI run after run, the corpus carries a prompt-byte anchor, and corpus:check
    # gates it in the deterministic job. The cost of staying advisory was measured tonight: a poisoned
    # suite corpus (#178) failed this job, the run-level conclusion still read `success`, and a merge
    # proceeded on that reading. Restoring the gate is #92's own recorded consequence, not a reversal.
    # See https://github.com/treeseed-ai/dsh-chapters/
    # issues/92, which also records the condition that restores it (the `suite`/`enrich`/`heavy` subset
    # green in replay on staging, with `npm run corpus:check` matching the build). The deterministic
    # plane above stays blocking, so code that does not compile or does not pass tests still cannot land.

    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The e2e boots spawn the INSTALLED dsh host. Not `npm i -g`: the host's
      # version alone is NOT reproducible (its caret ranges float, and base
      # rc.2 -> rc.3 changed system-prompt bytes every tape depends on), and
      # npm's global mode rewrites the plugin tree (measured: sandbox family
      # vanishes, boot dies 'could not be resolved'). So the host ships as a
      # HERMETIC LOCKFILE — dev/dsh-host-lock — resolved with --before pinned
      # to the verified install date, materialized by `npm ci` (identical
      # tree on any npm version, prebuilt natives, no install scripts run).
      # The whole repo stays npm-only; pnpm appears NOWHERE (measured with a
      # PATH tripwire: the dev profile is built via `npm install file:…` and
      # the host never invokes pnpm at boot — only its `dsh plugin` writer
      # did, which this repo simply doesn't use).
      - name: install the pinned DSH host from its hermetic lockfile
        run: |
          npm ci --prefix "$GITHUB_WORKSPACE/dev/dsh-host-lock" --no-save --no-audit --no-fund || (cd dev/dsh-host-lock && npm ci --no-audit --no-fund)
          echo "$GITHUB_WORKSPACE/dev/dsh-host-lock/node_modules/.bin" >> "$GITHUB_PATH"
      - run: dsh --version
      # chromium's shared-library deps (the Playwright image lacks some) +
      # zstd: the durable session logs are zstd frames and EVERY spec's
      # turn-complete poll shells out to it — ubuntu-latest doesn't ship the
      # binary, and session.ts's honest catch made the silence indistinguishable
      # from a hung model for three 20-minute CI runs (measured 2026-09-24).
      # bubblewrap: the host mounts bash/fs/pwsh tools through the dsh-*-sandbox packages, which need a
      # user namespace. Measured on the runner: `bwrap version=not-installed userNamespaceTest=failed: spawnSync
      # bwrap ENOENT`, against `bubblewrap 0.11.1 / ok` on this host — that is why a CI session registered 7 tools
      # and a local one 34, so message 0 (the tape key) could never match. Provisioning the runtime dependency is
      # the fix; masking the header would hide a corpus recorded by different software than the one replaying it.
      - run: sudo apt-get update && sudo apt-get install -y libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libgbm1 libasound2t64 zstd bubblewrap
      # Ubuntu 24.04+ restricts unprivileged user namespaces via AppArmor, so installing bwrap is not enough:
      # the runner reported `bwrap version=bubblewrap 0.9.0 userNamespaceTest=failed: ... setting up uid map`.
      # Lift the restriction for this job only, and re-probe; if it still fails, the probe in ci-host-deps.txt
      # says so and the acceptance job stays honest about a runner that cannot host a developer's tool surface.
      - name: allow unprivileged user namespaces (bubblewrap needs them)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>&1 || echo "sysctl: not available on this image"
          sudo sysctl -w kernel.unprivileged_userns_clone=1 2>&1 || echo "sysctl: setting not present on this image"
          bwrap --ro-bind / / /bin/true && echo "bwrap probe: OK after sysctl" || echo "bwrap probe: still failing"
      # Self-checking chain: pins the host version, builds, bootstraps the
      # scratch home, installs chromium into var/ms-playwright, and runs
      # E2E_MODEL=replay npm run test:e2e (suite/fork/heavy/arrival/enrich/fanout/
      # rules). Tape misses answer as loud 503s — nothing talks to a model.
      # E2E_TAPE_DIFF: a miss also dumps the normalized incoming vs the
      # stored same-length prefixes, so the exact divergent byte pair is
      # downloadable from the failure artifact instead of being re-guessed.
      # #61 item 8: the acceptance chain must not write into the project's own store root. The boot now
      # pins `artifactStoreRoot` per port, and this is the tripwire if the pin stops holding — on a
      # pristine CI checkout there is no `.dsh-chapters/` at all, so a store APPEARING across the run is
      # itself the failure. `if: always()` because a suite that died halfway is exactly when someone
      # wants to know whether it left data behind.
      - name: snapshot the production store root
        run: node scripts/assert-store-untouched.mjs snapshot
      - name: tape replay (nine segments, no LLM)
        run: bash scripts/ci-replay.sh
        env:
          E2E_TAPE_DIFF: ${{ github.workspace }}/var/e2e-tape-diffs
          # #89: the throwaway homes are OUTSIDE the repository on purpose. Node resolves
          # `@deepseek-ai/*` bundles by walking up from the profile dir, and a home under `var/`
          # reaches this repo's node_modules (0.1.5-rc.2) and then the developer's ~/node_modules
          # (a linked dev build wearing the pin's version string). Measured by moving nothing but
          # the location: the same pinned host composed a 7,276-char system header under `var/` and
          # the CI-shaped short one under /tmp, and the suite replay flipped from 4-passed to a
          # `commonPrefix=1` miss. So the runner pins the root explicitly, and the artifact paths
          # below follow it.
          E2E_HOME_ROOT: /tmp/dsh-e2e
      - name: assert the production store root is untouched
        if: always()
        run: node scripts/assert-store-untouched.mjs verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-replay-diagnostics
          path: |
            test-results/
            var/e2e-boot.json
            var/e2e-tape-misses.log
            var/e2e-header-*.log
            var/ci-host-deps.txt
            var/e2e-home-plugins-*.log
            var/e2e-tape-diffs/
            var/e2e-server-*.log
            var/chain-replay-*.log
            var/e2e-session-logs/
            var/e2e-engine-errors.log
            var/e2e-engine-errors-*.log
            var/e2e-tool-links-*.log
            var/e2e-home-plugins-*.log
            /tmp/dsh-e2e/e2e-home-*/sessions/
            /tmp/dsh-e2e/e2e-home-*/storages/
            /tmp/dsh-e2e/e2e-home-*/settings.yaml
          if-no-files-found: ignore
