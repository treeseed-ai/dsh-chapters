# dsh-chapters DEV profile patch — Local Qwen as the default model and the
# Chapters preset as the default preset, so every new session in the dev
# profile gets the deterministic compaction engine without any per-session
# configuration. The llm-gate/fetch-timeouts rows mirror the live profile:
# slow local prefill needs the long fetch timeouts and a single in-flight
# generation (the llama server serializes generations anyway).
# #54: on 0.2.x the profile's `settings.yaml` is read by NOTHING — provider routes come
# from THIS file. Without the block below the host has no `local` provider at all, and the
# e2e browser opens on an "Add an API key to get started" dialog instead of a composer
# (measured on the first 0.2.0-rc.2 boot: the Preview Notice cleared, this one appeared).
# Kept byte-identical in shape to dev/settings.yaml's `llm-pi-ai` block so the two files
# cannot disagree about the stress regime: same 32K window, same 15K response, same env key.
- id: llm-pi-ai
  config:
    providers:
      local:
        displayName: Local
        api: openai-completions
        baseURL: http://localhost:8080/v1
        models:
          - id: qwen3.8-flash-next
            name: qwen3.8-flash-next (dev, 32K stress — the proving regime)
            contextWindow: 32000
            maxTokens: 15000
        apiKeyEnv: LOCAL_API_KEY
        streamIdleTimeoutMs: 3600000
        timeoutMs: 3600000
        reasoning: medium
        retryPolicy:
          mode: normal
          maxRetries: 0

- id: agent-default-model
  config:
    provider: local
    model: qwen3.8-flash-next

- id: agent-presets
  config:
    default: chapters

- id: llm-gate
  config:
    providers:
      local:
        maxConcurrent: 1
        maxQueued: 16
        queueTimeoutMs: 7200000

- id: fetch-timeouts
  config:
    headersTimeoutMs: 0
    bodyTimeoutMs: 0
