# DSH Chapters — Complete Development & Test Platform
#
# A self-contained stack: DSH Web UI + vLLM model server + test runner.
# Everything runs locally — no external API keys required for core operation.
#
# Usage:
#   Full stack (GPU):     docker compose up -d
#   Web UI only:          docker compose up -d dsh-web
#   Build all:            docker compose build
#   Logs:                 docker compose logs -f
#   Run tests:            docker compose exec dsh-test npm run test:e2e:replay
#   Stop:                 docker compose down
#   Full cleanup:         docker compose down -v --remove-orphans
#
# Services:
#   dsh-web    — DSH with full Web UI on port 3080
#   vllm       — Qwen3-4B-AWQ serving inference + systemone on port 8080
#   dsh-test   — Node.js + Playwright + Chromium for acceptance testing

name: dsh-chapters-dev

services:
  # ── vLLM Model Server ──────────────────────────────────────────────────────
  # Serves Qwen3-4B-AWQ under two model names:
  #   qwen3-4b-instruct   — general inference / agent conversations
  #   qwen3-4b-systemone  — decision model endpoint
  # Both resolve to the same weights; the distinction is semantic routing.
  vllm:
    build:
      context: .
      dockerfile: vllm.Dockerfile
    image: dsh-vllm:${IMAGE_TAG:-latest}
    container_name: dsh-vllm
    restart: unless-stopped
    ports:
      - "${VLLM_PORT:-8080}:8080"
    environment:
      MODEL_ID: ${VLLM_MODEL_ID:-Qwen/Qwen3-4B-AWQ}
      SERVED_NAMES: ${VLLM_SERVED_NAMES:-qwen3-4b-instruct qwen3-4b-systemone}
      MAX_MODEL_LEN: ${VLLM_MAX_MODEL_LEN:-32768}
      GPU_MEMORY_UTILIZATION: ${VLLM_GPU_MEM:-0.90}
      TENSOR_PARALLEL_SIZE: ${VLLM_TP_SIZE:-1}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - vllm-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks:
      - dsh-net

  # ── DSH Web UI Service ─────────────────────────────────────────────────────
  dsh-web:
    build:
      context: ../..
      dockerfile: dev/install/Dockerfile
      args:
        DSH_HOST_VERSION: ${DSH_HOST_VERSION:-latest}
    image: dsh-chapters-dev:${IMAGE_TAG:-latest}
    container_name: dsh-chapters-dev
    restart: unless-stopped
    depends_on:
      vllm:
        condition: service_healthy
    ports:
      - "${DSH_PORT:-3080}:3080"
    environment:
      # LLM — points at the vLLM service by default
      LLM_BASE_URL: ${LLM_BASE_URL:-http://vllm:8080/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3-4b-instruct}
      LLM_CONTEXT_WINDOW: ${LLM_CONTEXT_WINDOW:-32768}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-15000}
      LOCAL_API_KEY: ${LOCAL_API_KEY:-sk-local}
      # SystemOne decision endpoint (same vLLM, different model name)
      SYSTEMONE_BASE_URL: ${SYSTEMONE_BASE_URL:-http://vllm:8080/v1}
      SYSTEMONE_MODEL: ${SYSTEMONE_MODEL:-qwen3-4b-systemone}
      # Plugin API keys (optional — marketplace features need these)
      QWEN_TOKEN_PLAN_API_KEY: ${QWEN_TOKEN_PLAN_API_KEY:-}
      TINYFISH_API_KEY: ${TINYFISH_API_KEY:-}
      # DSH configuration — the container always binds 3080 INSIDE itself;
      # DSH_PORT only picks the host-side port of the mapping below.
      DSH_PORT: "3080"
      # 0.2.x refuses --host 0.0.0.0 (RCU safety, startup.js); bind loopback and
      # reach the UI through the published port mapping instead.
      DSH_HOST: "127.0.0.1"
      DSH_HOME: /dsh-home
    volumes:
      - dsh-sessions:/dsh-home/sessions
      - dsh-storage:/dsh-home/storages
      # Credentials are NOT a volume: a named volume mounted at a FILE path is
      # created as an empty DIRECTORY (mode 755) when the image has no file
      # there, and credentials-local refuses any world-readable credentials
      # document — a permanent restart loop. The entrypoint seeds the file with
      # mode 600 instead; nothing here needs it persisted (API keys ride in via
      # env: LOCAL_API_KEY / QWEN_TOKEN_PLAN_API_KEY).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # No /api/health route exists on host 0.2.x (measured: 404 even authenticated).
      # The SPA index answers 200 once the browser-trust fence passes; a Host whose
      # authority equals the bind address self-matches from inside the container.
      test: ["CMD-SHELL", "curl -fsS -H \"Host: localhost:3080\" http://localhost:3080/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - dsh-net

  # ── DSH Test Runner ────────────────────────────────────────────────────────
  # Full CI-capable test environment: Node.js 22, Playwright, Chromium.
  # Mounts the repo source so edits are reflected without rebuild.
  # Usage:
  #   docker compose run --rm dsh-test npm run test:e2e:replay
  #   docker compose run --rm dsh-test npm run test:unit
  #   docker compose exec dsh-test bash   # interactive shell
  dsh-test:
    build:
      context: ../..
      dockerfile: dev/install/test.Dockerfile
    image: dsh-chapters-test:${IMAGE_TAG:-latest}
    container_name: dsh-chapters-test
    depends_on:
      vllm:
        condition: service_healthy
    environment:
      # Point tests at the vLLM service
      LLM_BASE_URL: http://vllm:8080/v1
      LLM_MODEL: qwen3-4b-instruct
      LOCAL_API_KEY: sk-local
      SYSTEMONE_BASE_URL: http://vllm:8080/v1
      SYSTEMONE_MODEL: qwen3-4b-systemone
      # Playwright config
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      CI: "true"
      NODE_ENV: test
    volumes:
      # Mount repo source for live editing during test development
      - ../../:/workspace:ro
      # Persist test results and coverage reports
      - test-results:/workspace/test-results
      - coverage:/workspace/coverage
    working_dir: /workspace
    networks:
      - dsh-net

volumes:
  dsh-sessions:
    name: dsh-chapters-sessions
  dsh-storage:
    name: dsh-chapters-storage
  vllm-cache:
    name: dsh-vllm-cache
  test-results:
    name: dsh-test-results
  coverage:
    name: dsh-test-coverage

networks:
  dsh-net:
    name: dsh-chapters-net
