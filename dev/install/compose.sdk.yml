# DSH Chapters — SDK API Service Stack (#25)
#
# Hosts the Deepseek Harness as an SDK JSON-RPC API (no Web UI) so another
# system drives it with @deepseek-ai/dsh-sdk-client. Same image as the web
# stack, DSH_ROLE=gateway: a thin WebSocket↔stdio relay spawns
# `dsh --profile sdk` children per connection. The sdk profile carries the
# identical configuration to the Web UI profile — Alibaba/Qwen token-plan
# marketplace, local vLLM provider, dsh-chapters + codegraph + tinyfish.
#
# Usage:
#   Start:            GATEWAY_TOKEN=<secret> docker compose -f compose.sdk.yml up -d
#                     (or put GATEWAY_TOKEN in .env — compose reads it)
#   Health:           curl http://localhost:8765/healthz
#   Smoke (GPU box):  docker compose -f compose.sdk.yml exec dsh-agent-api node /gateway/smoke.mjs
#   Stop:             docker compose -f compose.sdk.yml down
#
# Security: this surface executes code. GATEWAY_TOKEN is mandatory (the
# container refuses to boot without it); publish on loopback only unless you
# front it with TLS. One role per $DSH_HOME mount at a time — running this
# alongside a live dsh-web over the same sessions volume is untested; give
# each stack its own home if both must run.
#
# Services:
#   vllm          — Qwen3-4B-AWQ serving inference + systemone on port 8080
#   dsh-agent-api — SDK gateway on port 8765 (WebSocket, token-authenticated)

name: dsh-chapters-sdk

x-vllm-env: &vllm-env
  MODEL_ID: ${VLLM_MODEL_ID:-Qwen/Qwen3-4B-AWQ}
  SERVED_NAMES: ${VLLM_SERVED_NAMES:-qwen3-4b-instruct qwen3-4b-systemone}
  MAX_MODEL_LEN: ${VLLM_MAX_MODEL_LEN:-32768}
  GPU_MEMORY_UTILIZATION: ${VLLM_GPU_MEM:-0.75}
  TENSOR_PARALLEL_SIZE: ${VLLM_TP_SIZE:-1}
  HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}

services:
  # ── vLLM Model Server (identical contract to compose.yml) ──────────────────
  vllm:
    build:
      context: .
      dockerfile: vllm.Dockerfile
    image: dsh-vllm:${IMAGE_TAG:-latest}
    container_name: dsh-vllm
    restart: unless-stopped
    ports:
      - "${VLLM_PORT:-8080}:8080"
    environment: *vllm-env
    volumes:
      - vllm-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks:
      - dsh-net

  # ── DSH SDK API Gateway ────────────────────────────────────────────────────
  dsh-agent-api:
    build:
      context: ../..
      dockerfile: dev/install/Dockerfile
      args:
        DSH_HOST_VERSION: ${DSH_HOST_VERSION:-latest}
    image: dsh-chapters-dev:${IMAGE_TAG:-latest}
    container_name: dsh-agent-api
    restart: unless-stopped
    depends_on:
      vllm:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8765}:8765"
    environment:
      # This file's whole point is the gateway role; the default here is not
      # an accident to override — a drifted image cannot silently boot a Web
      # UI on the SDK port because the entrypoint refuses unknown roles.
      DSH_ROLE: ${DSH_ROLE:-gateway}
      # LLM — points at the vLLM service by default
      LLM_BASE_URL: ${LLM_BASE_URL:-http://vllm:8080/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3-4b-instruct}
      LLM_CONTEXT_WINDOW: ${LLM_CONTEXT_WINDOW:-32768}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-15000}
      LOCAL_API_KEY: ${LOCAL_API_KEY:-sk-local}
      SYSTEMONE_BASE_URL: ${SYSTEMONE_BASE_URL:-http://vllm:8080/v1}
      SYSTEMONE_MODEL: ${SYSTEMONE_MODEL:-qwen3-4b-systemone}
      QWEN_TOKEN_PLAN_API_KEY: ${QWEN_TOKEN_PLAN_API_KEY:-}
      TINYFISH_API_KEY: ${TINYFISH_API_KEY:-}
      # Gateway knobs — the listener binds loopback INSIDE the container;
      # the published mapping above is what makes it reachable from the host.
      GATEWAY_PORT: "8765"
      DSH_GATEWAY_BIND: "127.0.0.1"
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-}
      GATEWAY_IDLE_MS: ${GATEWAY_IDLE_MS:-1800000}
      GATEWAY_INIT_TIMEOUT_MS: ${GATEWAY_INIT_TIMEOUT_MS:-30000}
      DSH_SDK_PROFILE: ${DSH_SDK_PROFILE:-sdk}
      DSH_HOME: /dsh-home
    volumes:
      - dsh-sessions:/dsh-home/sessions
      - dsh-storage:/dsh-home/storages
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # The gateway serves /healthz itself (no dsh dependency by design), so an
      # HTTP probe is honest here — unlike the web role's TCP-only probe.
      test: ["CMD", "bash", "-c", 'curl -fsS http://127.0.0.1:8765/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - dsh-net

volumes:
  dsh-sessions:
    name: dsh-chapters-sessions
  dsh-storage:
    name: dsh-chapters-storage
  vllm-cache:
    name: dsh-vllm-cache

networks:
  dsh-net:
    name: dsh-chapters-net
